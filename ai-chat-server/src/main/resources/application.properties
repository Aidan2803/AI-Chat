spring.application.name=ai-chat-server

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_chat}
spring.datasource.username=${DB_USERNAME:ai_chat_user}
spring.datasource.password=${DB_PASSWORD:Chlprc1403}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

logging.level.org.hibernate=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.security=DEBUG

ai.provider=${AI_PROVIDER:ollama}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:llama3.2:3b}
ai.ollama.system-prompt=${AI_SYSTEM_PROMPT:}
