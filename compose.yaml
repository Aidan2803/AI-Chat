name: ai-chat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_chat}
      POSTGRES_USER: ${POSTGRES_USER:-ai_chat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_chat_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ./ai-chat-server
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ai_chat}
      DB_USERNAME: ${POSTGRES_USER:-ai_chat_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ai_chat_password}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
